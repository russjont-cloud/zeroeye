name: Codex regenerate diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run build.py diagnostic flow
        run: |
          set +e
          python3 build.py
          status=$?
          echo "build.py exited with ${status}; keeping generated diagnostic artifacts if present"
          git status --short
          exit 0

      - name: Commit generated diagnostics
        run: |
          set -euo pipefail
          git add diagnostic/
          if git diff --cached --quiet; then
            echo "No diagnostic changes generated"
            exit 1
          fi
          short_sha="$(git rev-parse --short HEAD)"
          git commit -m "Add build diagnostics for ${short_sha}"
          git push

