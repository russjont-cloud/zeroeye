name: Codex regenerate diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - docs-contributing-bounty-12

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run build.py diagnostic flow
        run: |
          set +e
          python3 build.py
          status=$?
          echo "build.py exited with ${status}; keeping generated diagnostic artifacts if present"
          git status --short
          exit 0

      - name: Push build.py diagnostic commit
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
            echo "No diagnostic commit generated"
            exit 1
          fi
          git push
