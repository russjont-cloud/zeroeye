name: Codex generate diagnostic

on:
  push:
    branches:
      - docs-contributing-bounty-12

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.repository == 'russjont-cloud/zeroeye'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "russjont-cloud"
          git config user.email "russjont@gmail.com"

      - name: Run build diagnostics
        run: |
          set +e
          python3 build.py
          status=$?
          echo "build.py exited with ${status}"
          exit 0

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/codex-generate-diagnostic.yml
          git commit -m "Remove temporary diagnostic workflow" || true

      - name: Push generated diagnostics
        run: git push origin HEAD:docs-contributing-bounty-12
